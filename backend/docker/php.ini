; OPcache: en producción el código no cambia entre deploys, no hace falta revalidar.
opcache.enable=1
opcache.validate_timestamps=0
opcache.memory_consumption=128
opcache.max_accelerated_files=10000
opcache.interned_strings_buffer=16
; Límites acordes a las subidas de imagen (máx. 5 MB en la API).
upload_max_filesize=6M
post_max_size=8M
memory_limit=128M
expose_php=0
